<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Список пользователей</title>
</head>
<body>
<h1>Пользователи</h1>

<a th:href="@{/admin/new}">Добавить пользователя</a>

<table border="1">
  <tr>
    <th>Id</th>
    <th>Имя</th>
    <th>Фамилия</th>
    <th>Возраст</th>
    <th>Национальность</th>
    <th></th>
  </tr>
  <tr th:each="user : ${users}">
    <td th:text="${user.id}"></td>
    <td th:text="${user.name}"></td>
    <td th:text="${user.lastName}"></td>
    <td th:text="${user.age}"></td>
    <td th:text="${user.nationality}"></td>
    <td>
      <a th:href="@{/admin/edit/{id}(id=${user.id})}">Изменить</a>
      <a th:href="@{/admin/delete/{id}(id=${user.id})}">Удалить</a>
    </td>
  </tr>
</table>
</body>
</html>
